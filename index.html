<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080611" />
    <meta name="description" content="رحلة صغيرة في عالم معمول مخصوص لريناد." />
    <meta property="og:title" content="RENAD — A Universe Made for You" />
    <meta property="og:description" content="رحلة صغيرة في عالم معمول مخصوص لريناد." />
    <meta property="og:image" content="assets/logos/logo-circle.jpg" />
    <link rel="icon" href="assets/logos/logo-circle.jpg" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <title>RENAD — A Universe Made for You</title>
  </head>
  <body>
    <a class="skip-link" href="#scene-content">تخطي إلى المشهد</a>
    <picture class="backdrop" aria-hidden="true">
      <source media="(max-width: 700px)" srcset="assets/banners/hero-mobile.jpg" />
      <img src="assets/banners/hero-wide.jpg" alt="" width="1376" height="768" fetchpriority="high" />
    </picture>
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="ambient-glow" aria-hidden="true"></div>
    <div class="cosmic-trail" aria-hidden="true"></div>

    <main id="app" class="app-shell">
      <header class="topbar" aria-label="أدوات الرحلة">
        <button class="brand-mark" id="home-button" aria-label="العودة إلى بداية الرحلة">
          <img src="assets/logos/logo-circle.jpg" alt="" width="42" height="42" />
          <span>Renad ♡ <small>ريناد | رينو | رونشتي</small></span>
        </button>
        <div class="journey-status">
          <span id="scene-counter">01 / 16</span>
          <span id="scene-name">البوابة</span>
          <div class="progress-track" role="progressbar" aria-label="تقدم الرحلة" aria-valuemin="1" aria-valuemax="16" aria-valuenow="1"><span id="progress-fill"></span></div>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="audio-toggle" aria-label="تشغيل الموسيقى" title="الموسيقى">♫</button>
          <button class="icon-button" id="scene-menu-toggle" aria-label="فتح قائمة المشاهد" aria-expanded="false" title="المشاهد">☷</button>
          <button class="icon-button" id="motion-toggle" aria-label="تقليل المؤثرات" aria-pressed="false" title="تقليل المؤثرات">✧</button>
        </div>
      </header>

      <nav class="scene-menu" id="scene-menu" aria-label="مشاهد الرحلة" hidden>
        <div class="menu-heading"><span>محطات الرحلة</span><button id="menu-close" class="text-button">إغلاق</button></div>
        <div class="menu-preferences">
          <label for="quality-select">جودة المؤثرات</label>
          <select id="quality-select" aria-label="اختيار جودة المؤثرات">
            <option value="cinematic">سينمائية</option>
            <option value="balanced">متوازنة</option>
            <option value="light">خفيفة</option>
          </select>
        </div>
        <div id="scene-links" class="scene-links"></div>
      </nav>

      <section class="scene-stage" id="scene-content" aria-live="polite" aria-atomic="false" tabindex="-1">
        <div class="loading-note" id="loading-note" role="status">بنحضّر عالم صغير مخصوص ليكي…</div>
      </section>

      <footer class="player-dock" id="player-dock" data-expanded="false" aria-label="مشغل الموسيقى">
        <img src="assets/images/song-cover.jpg" alt="غلاف حلف القمر" width="42" height="42" />
        <div class="track-meta"><strong id="track-title">حلف القمر</strong><span id="track-state">جاهزة لما تحبي تسمعيها</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="تقديم أو إرجاع الأغنية" /><span id="track-time">0:00 / --:--</span></div>
        <audio id="audio" preload="none"></audio>
        <button id="track-previous" class="transport-button" aria-label="الأغنية السابقة" title="الأغنية السابقة">‹</button>
        <button id="play-button" class="play-button" aria-label="تشغيل حلف القمر">▶</button>
        <button id="track-next" class="transport-button" aria-label="الأغنية التالية" title="الأغنية التالية">›</button>
        <button id="mute-button" class="transport-button mute-button" aria-label="كتم الصوت" title="كتم الصوت">◖))</button>
        <label class="volume-control"><span class="sr-only">مستوى الصوت</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.75" /></label>
        <button id="player-expand" class="player-expand" type="button" aria-label="تكبير مشغل الموسيقى" aria-expanded="false" title="تكبير مشغل الموسيقى"><span aria-hidden="true">⌃</span></button>
      </footer>

      <dialog id="gallery-dialog" class="gallery-dialog" aria-label="معرض الذكريات">
        <button class="dialog-close" data-close-gallery aria-label="إغلاق الصورة">×</button>
        <button class="gallery-arrow gallery-prev" aria-label="الصورة السابقة">‹</button>
        <figure><img id="gallery-image" src="assets/images/renad-1.jpg" alt="ذكرى من رحلة ريناد" width="1200" height="1200" /><figcaption id="gallery-caption"></figcaption></figure>
        <button class="gallery-arrow gallery-next" aria-label="الصورة التالية">›</button>
      </dialog>
    </main>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
